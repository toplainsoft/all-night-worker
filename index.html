<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>올빼미방</title>
<meta name="description" content="밤샘하는 사람들이 올빼미가 되어 같이 깨어 있는 온라인 작업방">
<meta property="og:title" content="올빼미방">
<meta property="og:description" content="밤에만 불 켜지는 건물 2층, 같이 깨어 있는 올빼미들">
<meta name="theme-color" content="#15131f">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
/* Layout: full-bleed 3D reading room; sign + clock on top, my desk controls docked at the bottom, entry card on first visit */
:root {
  color-scheme: dark;
  --bg: #15131f;
  --panel: rgba(24, 21, 36, 0.86);
  --edge: #3a3250;
  --paper: #eee5d1;
  --muted: #a39dbd;
  --faint: #5d5775;
  --lamp: #ffbf5e;
  --ink: #120f1c;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
}
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage canvas { display: block; width: 100%; height: 100%; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag {
  position: absolute;
  transform: translate(-50%, -100%);
  background: rgba(18, 15, 28, 0.78);
  border: 1px solid var(--edge);
  border-radius: 6px;
  padding: 3px 9px 4px;
  text-align: center;
  white-space: nowrap;
  font-size: 12px;
  line-height: 1.35;
  pointer-events: auto;
  cursor: pointer;
}
.tag b { font-weight: 600; font-size: 13px; color: var(--paper); }
.tag .job { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 5px; }
.tag i { display: block; font-style: normal; color: var(--muted); font-size: 11px; }
textarea {
  font: inherit; color: var(--paper); background: #120f1c;
  border: 1px solid var(--edge); border-radius: 6px; padding: 9px 12px; width: 100%; min-height: 120px; resize: vertical;
}
textarea:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.inbox { max-height: 58vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin: 0 -4px; padding: 0 4px; }
.note { border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px; background: #15131f; }
.note header { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.note header b { color: var(--paper); font-weight: 600; }
.note .kind { color: var(--lamp); margin-right: 6px; }
.note p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; color: var(--paper); }
.empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--lamp); color: var(--ink); font-size: 12px; line-height: 18px; text-align: center; }
.dock [data-out] { display: none; }
.dock.outside [data-out] { display: inline-block; }
.dock.outside [data-in] { display: none !important; }
.menu {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  background: #1d1a2b; border: 1px solid var(--edge); border-radius: 10px;
  padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 220px;
  box-shadow: 0 12px 40px #000a;
}
@media (max-width: 560px) { .menu { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); } }
.menu .label { padding: 2px 4px 4px; }
.menu button {
  font: inherit; font-size: 14px; text-align: left; color: var(--paper);
  background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 7px 10px; cursor: pointer;
  display: flex; justify-content: space-between; gap: 16px;
}
.menu button:hover, .menu button[aria-current="true"] { border-color: var(--edge); background: #2a2438; }
.menu button span { color: var(--muted); font-variant-numeric: tabular-nums; }
.menu button .mine { color: var(--lamp); }
#outLabels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.floors { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; pointer-events: auto; max-width: 60vw; }
.floor-btn {
  font: inherit; font-size: 12px; white-space: nowrap;
  color: var(--muted); background: rgba(18, 15, 28, 0.7);
  border: 1px solid var(--edge); border-radius: 6px; padding: 3px 9px; cursor: pointer;
}
.floor-btn b { color: var(--paper); font-weight: 600; margin-right: 4px; }
.floor-btn[aria-pressed="true"] { border-color: var(--lamp); color: var(--paper); }
.floor-btn .mine { color: var(--lamp); margin-left: 4px; }
.bubble {
  position: absolute;
  transform: translate(-50%, calc(-100% - 46px));
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  padding: 7px 12px;
  border-radius: 14px;
  white-space: nowrap;
  box-shadow: 0 6px 20px #0007;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); border: 7px solid transparent; border-bottom: none; border-top-color: var(--paper); }
.btn.quiet { background: transparent; color: var(--muted); }
.tag.me { border-color: var(--lamp); cursor: default; }
.tag.me b::before { content: "나 · "; color: var(--lamp); font-size: 11px; }

.top {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  pointer-events: none;
}
.sign small { display: block; font-size: 11px; letter-spacing: 0.14em; color: var(--muted); }
.sign h1 { margin: 2px 0 6px; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 5vw, 2.4rem); line-height: 1.1; }
.mood { font-size: 14px; color: var(--paper); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; max-width: 34ch; }
.mood .count { color: var(--lamp); font-weight: 600; }
.mood .sub { color: var(--muted); }
.stamp { border: 2px solid #e2796b; color: #f0907f; border-radius: 4px; padding: 1px 8px; font-family: var(--font-display); font-weight: 700; transform: rotate(-4deg); display: inline-block; }
.clock { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: clamp(1.5rem, 4.5vw, 2.1rem); color: var(--lamp); text-align: right; line-height: 1; }
.clock span { display: block; font-family: var(--font-body); font-size: 11px; color: var(--muted); margin-top: 6px; }

.dock {
  position: fixed;
  left: 50%;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: min(760px, calc(100% - 2 * max(16px, env(safe-area-inset-left, 0px))));
  background: var(--panel);
  backdrop-filter: blur(8px);
  border: 1px solid var(--edge);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
}
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who button.name {
  font: inherit; font-weight: 600; color: var(--paper);
  background: none; border: none; padding: 0; cursor: pointer;
  text-decoration: underline dotted var(--faint); text-underline-offset: 4px;
  max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; border: 2px solid var(--paper); }
.chips { display: flex; flex-wrap: wrap; align-items: center; align-content: flex-start; gap: 6px; flex: 1 1 260px; min-width: 0; }
.field .chips { flex: none; }
.chip {
  white-space: nowrap;
  flex: none;
  font: inherit; font-size: 13px; color: var(--muted);
  background: transparent; border: 1px solid var(--edge); border-radius: 999px;
  padding: 3px 10px; cursor: pointer;
}
.chip[aria-pressed="true"] { color: var(--ink); background: var(--lamp); border-color: var(--lamp); font-weight: 600; }
.actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.elapsed { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.btn {
  font: inherit; font-weight: 600; font-size: 14px;
  border-radius: 6px; padding: 7px 12px; cursor: pointer;
  border: 1px solid var(--edge); background: #2a2438; color: var(--paper);
}
.btn.primary { background: var(--lamp); color: var(--ink); border-color: var(--lamp); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }

/* entry */
.gate {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background: rgba(10, 9, 18, 0.55);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.card {
  width: min(420px, 100%);
  background: #1d1a2b;
  border: 1px solid var(--edge);
  border-radius: 12px;
  padding: 22px 22px 20px;
  display: flex; flex-direction: column; gap: 16px;
  box-shadow: 0 20px 60px #0009;
}
.card h2 { margin: 0; font-family: var(--font-display); font-size: 1.5rem; text-wrap: balance; }
.card p { margin: -8px 0 0; color: var(--muted); font-size: 14px; }
.preview { display: flex; justify-content: center; }
.preview svg { width: 96px; height: 106px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.label { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); }
input[type="text"] {
  font: inherit; color: var(--paper); background: #120f1c;
  border: 1px solid var(--edge); border-radius: 6px; padding: 9px 12px; width: 100%;
}
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; outline-offset: 2px; }
.swatch[aria-pressed="true"] { border-color: var(--lamp); }

.hint {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  color: var(--muted); font-size: 12px; white-space: nowrap; pointer-events: none;
}
@media (max-width: 560px) { .hint { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); } }
@media (max-width: 560px) {
  .sign h1 { font-size: 1.6rem; margin-bottom: 2px; }
  .mood { font-size: 12px; max-width: 26ch; }
  .clock { font-size: 1.4rem; }
  .clock span { display: none; }
  .dock { padding: 9px 10px; gap: 8px; border-radius: 12px; }
  .dock .who { display: none; }
  .dock .chips { flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .dock .chips::-webkit-scrollbar { display: none; }
  .dock .chip { font-size: 12px; padding: 4px 10px; }
  .dock .actions { flex: 1 1 100%; margin-left: 0; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .dock .actions::-webkit-scrollbar { display: none; }
  .dock .btn { font-size: 13px; padding: 6px 10px; white-space: nowrap; flex: none; }
  .dock .elapsed { font-size: 12px; flex: none; }
  .tag { font-size: 11px; padding: 2px 7px 3px; }
  .tag b { font-size: 12px; }
  .hint { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); white-space: normal; text-align: center; width: calc(100% - 48px); }
  .toast { top: calc(96px + env(safe-area-inset-top, 0px)); }
}

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  top: calc(110px + env(safe-area-inset-top, 0px));
  background: var(--paper); color: var(--ink);
  padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 14px;
  max-width: calc(100% - 32px); box-shadow: 0 8px 30px #0008;
}
</style>
</head>
<body>

<div id="stage" aria-label="올빼미방 3D 화면"></div>
<div id="labels"></div>

<div class="top">
  <div class="sign">
    <small id="floorLabel">밤에만 불 켜지는 건물 · 2층</small>
    <h1>올빼미방</h1>
    <div class="mood" id="mood"></div>
  </div>
  <div class="clock" id="clock">00:00<span>밤 9시 – 아침 7시</span></div>
</div>

<div id="outLabels" hidden></div>
<div class="menu" id="floorMenu" hidden></div>
<div class="hint" id="hint" hidden>드래그해서 둘러보고, 다른 올빼미를 누르면 응원을 보내요</div>

<div class="dock" id="dock" hidden>
  <div class="who">
    <span class="dot" id="mydot"></span>
    <button class="name" id="myname" type="button" title="이름 바꾸기"></button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="지금 뭐 하는 중" data-in></div>
  <div class="actions">
    <span class="elapsed" id="elapsed" title="오늘 밤 버틴 시간">0:00</span>
    <button class="btn primary" id="coffee" type="button" data-in>커피 리필</button>
    <button class="btn primary" id="comeback" type="button" data-out>책상으로 돌아가기</button>
    <button class="btn" id="desksound" type="button" aria-pressed="false" data-in>책상 소리</button>
    <button class="btn" id="sound" type="button" aria-pressed="false">빗소리</button>
  </div>
  <div class="actions" data-in style="margin-left:0">
    <button class="btn" id="stroll" type="button">산책가기</button>
    <button class="btn" id="floorsBtn" type="button" aria-expanded="false" aria-controls="floorMenu">다른 층 구경가기</button>
    <!-- 의견 보내기: 다시 쓰려면 hidden 을 지우세요 -->
    <button class="btn" id="fbBtn" type="button" hidden>의견 보내기</button>
    <button class="btn quiet" id="leave" type="button">퇴장하기</button>
  </div>
</div>

<div class="gate" id="gate">
  <form class="card" id="gateForm">
    <h2 id="gateTitle">올빼미방에 들어가요</h2>
    <p id="gateText">이름표를 달고 내 올빼미 깃털 색을 골라주세요.</p>
    <div class="preview" id="preview"></div>
    <div class="field">
      <label class="label" for="nick">이름</label>
      <input type="text" id="nick" maxlength="12" autocomplete="off" required>
    </div>
    <div class="field">
      <label class="label" for="job">하는 일 (안 써도 돼요)</label>
      <input type="text" id="job" maxlength="14" autocomplete="off" placeholder="예: 일러스트레이터, 대학원생">
    </div>
    <div class="field">
      <span class="label" id="sw-label">깃털 색</span>
      <div class="swatches" id="swatches" role="group" aria-labelledby="sw-label"></div>
    </div>
    <div class="field">
      <span class="label" id="st-label">지금 뭐 하는 중?</span>
      <div class="chips" id="gateChips" role="group" aria-labelledby="st-label"></div>
    </div>
    <button class="btn primary" id="enter" type="submit" style="padding:11px">책상에 앉기</button>
  </form>
</div>

<div class="gate" id="fbGate" hidden>
  <form class="card" id="fbForm">
    <h2>올빼미방 개선 의견</h2>
    <p>이런 게 있으면 좋겠다, 이건 불편하다, 뭐든 적어주세요. 방을 만든 사람에게 모여요.</p>
    <div class="field">
      <span class="label" id="fbk-label">어떤 의견인가요?</span>
      <div class="chips" id="fbKinds" role="group" aria-labelledby="fbk-label"></div>
    </div>
    <div class="field">
      <label class="label" for="fbText">의견</label>
      <textarea id="fbText" maxlength="500" required placeholder="예: 새벽 5시쯤 창밖에 새 소리가 났으면 좋겠어요"></textarea>
    </div>
    <div class="row">
      <button class="btn quiet" id="fbClose" type="button">닫기</button>
      <button class="btn primary" id="fbSend" type="submit">보내기</button>
    </div>
  </form>
</div>


<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const STATUSES = [["work", "작업 중"], ["study", "공부 중"], ["awake", "그냥 못 자는 중"], ["slack", "딴짓 중"]];
  const STATUS_LABEL = Object.fromEntries(STATUSES);
  const FEATHERS = [
    { key: "brown", label: "갈색", body: "#8a6a4f", belly: "#d9c3a5" },
    { key: "grey", label: "잿빛", body: "#7f7c8f", belly: "#cfcbd8" },
    { key: "snow", label: "흰색", body: "#e6e1d6", belly: "#fbf8f1" },
    { key: "night", label: "보라", body: "#5b4a72", belly: "#b7a6cc" },
    { key: "gold", label: "황금", body: "#c39437", belly: "#f1deab" },
    { key: "rust", label: "적갈", body: "#9a4f3a", belly: "#e6b9a0" },
    { key: "moss", label: "이끼", body: "#5f7553", belly: "#c8d5b7" },
    { key: "sky", label: "하늘", body: "#6f8fb8", belly: "#d2def0" },
    { key: "peach", label: "분홍", body: "#c98a98", belly: "#f4d6dc" },
    { key: "ink", label: "먹색", body: "#3a3743", belly: "#9d99aa" }
  ];
  const MAX_COFFEE = 20;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const loadedAt = Date.now();
  const $ = (id) => document.getElementById(id);

  function load(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function clean(v, max) { return typeof v === "string" ? v.replace(/[\u0000-\u001f]/g, "").slice(0, max) : ""; }
  function fmtElapsed(ms) { const m = Math.max(0, Math.floor(ms / 60000)); return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); }

  const me = {
    name: load("owl2.name", "올빼미 " + (10 + Math.floor(Math.random() * 90))),
    color: Math.max(0, Math.min(9, parseInt(load("owl2.color", "0"), 10) || 0)),
    status: load("owl2.status", "work"),
    coffee: 0,
    job: load("owl2.job", ""),
    floor: 2,
    since: 0,
    seat: -1
  };
  if (!STATUS_LABEL[me.status]) me.status = "work";
  let entered = false;
  let mode = "inside", strolling = false;
  let leaving = false;
  let cheerCooldown = 0;
  const lastCoffee = {};

  // ---------- toast ----------
  const toast = $("toast"); let toastT = 0;
  function showToast(t) { toast.textContent = t; toast.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (toast.hidden = true), 3000); }

  // ---------- entry card ----------
  function owlSvg(f) {
    return '<svg viewBox="0 0 54 60" aria-hidden="true"><path d="M8 22 L13 5 L20 17 Z M46 22 L41 5 L34 17 Z" fill="' + f.body + '"/>' +
      '<ellipse cx="27" cy="36" rx="20" ry="22" fill="' + f.body + '"/><ellipse cx="27" cy="43" rx="12" ry="13" fill="' + f.belly + '"/>' +
      '<circle cx="19" cy="27" r="8" fill="#f4eee0"/><circle cx="35" cy="27" r="8" fill="#f4eee0"/>' +
      '<circle cx="19" cy="27" r="4" fill="#15131f"/><circle cx="35" cy="27" r="4" fill="#15131f"/><path d="M24 33 L27 38 L30 33 Z" fill="#ffbf5e"/></svg>';
  }
  const nick = $("nick"); nick.value = me.name;
  const jobIn = $("job"); jobIn.value = me.job;
  const swatches = $("swatches");
  FEATHERS.forEach((f, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "swatch"; b.id = "sw-" + f.key;
    b.style.background = f.body; b.setAttribute("aria-label", f.label);
    b.setAttribute("aria-pressed", String(i === me.color));
    b.addEventListener("click", () => {
      me.color = i;

  // ---------- network: Supabase Realtime (per floor) + seat table ----------

      c = { ch, state: {}, ready: false };

    g.fillText(text, w / 2, h / 2 + 2);
    const tx = new THREE.CanvasTexture(c); tx.encoding = THREE.sRGBEncoding; return tx;
  }
  function buildStreet() {
    streetBuilt = true;
    street = new THREE.Scene();
    street.background = new THREE.Color("#0b0a16");
    street.fog = new THREE.Fog("#0b0a16", 30, 70);
    street.add(new THREE.AmbientLight("#4a4370", 0.7));
    street.add(new THREE.HemisphereLight("#6c6aa8", "#120f1c", 0.35));
    const moon = new THREE.DirectionalLight("#a9b6ff", 0.45); moon.position.set(-8, 14, 10); street.add(moon);
    const sky = new THREE.Mesh(new THREE.PlaneGeometry(120, 50), new THREE.MeshBasicMaterial({ map: skyTex, fog: false }));
    sky.position.set(0, 18, -30); street.add(sky);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 80), lambert("#1b1824")); ground.rotation.x = -Math.PI / 2; street.add(ground);
    const walk = new THREE.Mesh(new THREE.BoxGeometry(60, 0.12, 4), lambert("#3a3546")); walk.position.set(0, 0.06, 3); street.add(walk);
    const curb = new THREE.Mesh(new THREE.BoxGeometry(60, 0.18, 0.25), lambert("#4d4759")); curb.position.set(0, 0.09, 5.1); street.add(curb);
    const road = new THREE.Mesh(new THREE.PlaneGeometry(60, 9), lambert("#16141d")); road.rotation.x = -Math.PI / 2; road.position.set(0, 0.01, 9.7); street.add(road);
    for (let x = -28; x < 30; x += 3) { const d = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.15), lambert("#8a8470")); d.rotation.x = -Math.PI / 2; d.position.set(x, 0.02, 9.7); street.add(d); }
    // neighbours: dark low buildings with a few lit windows
    [[-17, 7, 9], [17, 6, 11], [-26, 9, 7], [26, 8, 6]].forEach(([x, w, h]) => {
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 6), lambert("#16131f")); b.position.set(x, h / 2, -2); street.add(b);
      for (let k = 0; k < 4; k++) { const wnd = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.8), new THREE.MeshBasicMaterial({ color: k % 3 ? "#1d2233" : "#c9a15e" })); wnd.position.set(x - w / 2 + 1 + k * (w - 2) / 3, 1.5 + (k * 1.7) % (h - 2), 1.01); street.add(wnd); }
    });
    // street lamps
    [-9, 9].forEach((x) => {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 4.2, 8), lambert("#2c2836")); pole.position.set(x, 2.1, 4.6); street.add(pole);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), new THREE.MeshBasicMaterial({ color: "#ffd38a" })); head.position.set(x, 4.25, 4.6); street.add(head);
      const l = new THREE.PointLight("#ffb35a", 1.4, 9, 2); l.position.set(x, 4, 4.6); street.add(l);
    });
    const front = new THREE.PointLight("#ffbf6e", 1.2, 8, 2); front.position.set(0, 1.6, 2); street.add(front);
  }
  function buildBuilding(floors) {
    if (building) street.remove(building);
    building = new THREE.Group(); buildingFloors = floors;
    const H = floors * FLOOR_H;
    const body = new THREE.Mesh(new THREE.BoxGeometry(BLD_W, H, 7), lambert("#2a2438")); body.position.set(0, H / 2, -3.5); building.add(body);
    const cornice = new THREE.Mesh(new THREE.BoxGeometry(BLD_W + 0.4, 0.25, 7.4), lambert("#3a3250")); cornice.position.set(0, H + 0.1, -3.5); building.add(cornice);
    for (let f = 1; f < floors; f++) { const band = new THREE.Mesh(new THREE.BoxGeometry(BLD_W + 0.1, 0.08, 0.1), lambert("#3a3250")); band.position.set(0, f * FLOOR_H, 0.03); building.add(band); }
    // 1층: entrance
    const door = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.35), new THREE.MeshBasicMaterial({ color: "#ffcf8a" })); door.position.set(0, 0.68, 0.02); building.add(door);
    const awning = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.1, 1.2), lambert("#5b4a72")); awning.position.set(0, 1.45, 0.55); building.add(awning);
    const plate = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 0.42), new THREE.MeshBasicMaterial({ map: makeLabelTex("밤에만 불 켜지는 건물", "#ffbf5e", "#1d1a2b", 512, 48, 30) })); plate.position.set(-4.4, 1.0, 0.03); building.add(plate);
    const lobby = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.8), new THREE.MeshBasicMaterial({ color: "#1b2236" })); lobby.position.set(4.4, 0.9, 0.02); building.add(lobby);
    // roof sign
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 1.05), new THREE.MeshBasicMaterial({ map: makeLabelTex("올빼미방", "#ffbf5e", null, 512, 128, 84), transparent: true }));
    sign.position.set(0, H + 0.9, -0.2); building.add(sign);
    const signBar = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.08, 0.08), lambert("#3a3250")); signBar.position.set(0, H + 0.3, -0.2); building.add(signBar);
    // floors 2..N: 12 windows each, one per desk
    building.userData.windows = {};
    for (let f = 2; f <= floors; f++) {
      const y = (f - 1) * FLOOR_H + FLOOR_H * 0.52;
      const list = [];
      for (let k = 0; k < SEATS.length; k++) {
        const x = -BLD_W / 2 + 0.95 + k * ((BLD_W - 1.9) / (SEATS.length - 1));
        const frame = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 1.0), lambert("#3a3250")); frame.position.set(x, y, 0.015); building.add(frame);
        const wnd = new THREE.Mesh(new THREE.PlaneGeometry(0.64, 0.86), new THREE.MeshBasicMaterial({ color: "#1b2236" })); wnd.position.set(x, y, 0.025); building.add(wnd);
        list.push(wnd);
      }
      const num = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.35), new THREE.MeshBasicMaterial({ map: makeLabelTex(f + "층", "#a39dbd", "#2a2438", 128, 64, 34) }));
      num.position.set(BLD_W / 2 + 0.01, y, -0.6); num.rotation.y = Math.PI / 2; building.add(num);
      building.userData.windows[f] = list;
    }
    street.add(building);
  }
  // window order follows the desks left to right
  const SEAT_TO_WINDOW = SEATS.map((s) => s);
  function windowIndex(seat) {
    const s = SEATS[seat];
    const col = COLS.indexOf(s.x), row = ROWS.indexOf(s.z);
    return row * 4 + col;
  }
  function updateStreet(list) {
    const counts = floorCounts(list);
    const top = Math.max(2, ...Object.keys(counts).map(Number));
    if (!building || buildingFloors !== top + 1) buildBuilding(Math.max(3, top + 1));
    const lit = {};
    list.forEach((o) => { if (o.seat >= 0) (lit[o.floor] = lit[o.floor] || new Set()).add(windowIndex(o.seat)); });
    if (entered && me.seat >= 0) (lit[me.floor] = lit[me.floor] || new Set()).add(windowIndex(me.seat));
    Object.keys(building.userData.windows).forEach((f) => {
      building.userData.windows[f].forEach((w, k) => w.material.color.set(lit[f] && lit[f].has(k) ? "#ffc66e" : "#1b2236"));
    });
    // owls out on the sidewalk
    const out = list.filter((o) => o.outside).map((o) => ({ key: o.peer, name: o.name, color: o.color, isMe: false }));
    if (entered && mode === "outside") out.push({ key: "me", name: me.name, color: me.color, isMe: true });
    const keep = new Set(out.map((o) => o.key));
    walkers.forEach((w, k) => { if (!keep.has(k)) { street.remove(w.owl); w.tag.remove(); walkers.delete(k); } });
    out.forEach((o, n) => {
      let w = walkers.get(o.key);
      if (w && w.color !== o.color) { street.remove(w.owl); w.tag.remove(); walkers.delete(o.key); w = null; }
      if (!w) {
        const owl = makeOwl(FEATHERS[o.color]); owl.scale.setScalar(0.8);
        const x = o.isMe ? 0 : (Math.random() - 0.5) * 16;
        owl.position.set(x, 0.12, o.isMe ? 3.4 : 2.2 + Math.random() * 1.8);
        street.add(owl);
        const tag = document.createElement("div"); tag.className = "tag" + (o.isMe ? " me" : ""); tag.innerHTML = "<b></b><i>산책 중</i>";
        outLabels.appendChild(tag);
        w = { owl, x, dir: Math.random() < 0.5 ? -1 : 1, speed: 0.6 + Math.random() * 0.5, pause: 1 + Math.random() * 3, tag, color: o.color, isMe: o.isMe, t: Math.random() * 10 };
        walkers.set(o.key, w);
      }
      w.tag.querySelector("b").textContent = o.name;
    });
  }
  function stepStreet(dt, t, W, H) {
    const top = buildingFloors * FLOOR_H;
    target.set(0, Math.min(top * 0.42, 6), 0);
    walkers.forEach((w) => {
      const o = w.owl, u = o.userData;
      w.t += dt;
      if (w.isMe) {
        // stand on the sidewalk, looking up at the lit windows
        o.rotation.y += (Math.PI - o.rotation.y) * Math.min(1, dt * 4);
        u.head.rotation.set(-0.45 + Math.sin(w.t * 0.5) * 0.05, Math.sin(w.t * 0.3) * 0.35, 0);
        o.position.y = 0.12;
      } else if (w.pause > 0) {
        w.pause -= dt; o.position.y = 0.12; o.rotation.z *= 0.8;
        u.head.rotation.set(-0.35, Math.sin(w.t * 0.4) * 0.5, 0);
        o.rotation.y += (Math.PI - o.rotation.y) * Math.min(1, dt * 3);
      } else {
        o.position.x += w.dir * w.speed * dt;
        if (Math.abs(o.position.x) > 9) { w.dir = -Math.sign(o.position.x); w.pause = 1 + Math.random() * 2; }
        if (Math.random() < dt * 0.15) w.pause = 1.5 + Math.random() * 3;
        const want = w.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
        o.rotation.y += (want - o.rotation.y) * Math.min(1, dt * 6);
        const ph = w.t * 10;
        o.position.y = 0.12 + Math.abs(Math.sin(ph)) * 0.05; o.rotation.z = Math.sin(ph) * 0.12;
        u.head.rotation.set(0, 0, 0);
      }
      st_blink(w, dt);
      o.updateMatrixWorld();
      tmp.set(0, 1.75, 0).applyMatrix4(o.matrixWorld).project(camera);
      w.tag.style.left = ((tmp.x + 1) / 2 * W) + "px"; w.tag.style.top = ((1 - tmp.y) / 2 * H) + "px"; w.tag.style.display = tmp.z < 1 ? "" : "none";
    });
  }
  function st_blink(w, dt) {
    w.blink = (w.blink === undefined ? 3 : w.blink) - dt;
    let ey = 1; if (w.blink < 0) { ey = 0.08; if (w.blink < -0.14) w.blink = 2.5 + Math.random() * 3; }
    w.owl.userData.eyes.scale.y = ey;
  }


  // ---------- feedback box ----------
  const FB_KINDS = [["idea", "아이디어"], ["bug", "불편해요"], ["love", "좋아요"]];
  const FB_LABEL = Object.fromEntries(FB_KINDS);
  let fbKind = "idea", sending = false;
  const fbKinds = $("fbKinds");
  FB_KINDS.forEach(([k, label]) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.id = "fbk-" + k; b.textContent = label;
    b.setAttribute("aria-pressed", String(k === fbKind));
    b.addEventListener("click", () => { fbKind = k; fbKinds.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === b))); });
    fbKinds.appendChild(b);
  });
  $("fbBtn").addEventListener("click", () => { $("fbGate").hidden = false; $("fbText").focus(); });
  $("fbClose").addEventListener("click", () => { $("fbGate").hidden = true; });
  $("fbForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("fbText").value.replace(/[\u0000-\u0008\u000b-\u001f]/g, "").trim().slice(0, 500);
    if (!text || sending) return;
    if (!sb) { showToast("지금은 의견을 보낼 수 없어요."); return; }
    sending = true; $("fbSend").disabled = true; $("fbSend").textContent = "보내는 중";
    try {
      const r = await sb.from("owl_feedback").insert({ kind: fbKind, name: (entered ? me.name : clean(nick.value, 12)) || null, body: text });
      if (r.error) throw r.error;
      $("fbText").value = ""; $("fbGate").hidden = true;
      showToast("의견을 보냈어요. 고마워요!");
    } catch (err) {
      showToast("의견을 보내지 못했어요. 잠시 뒤 다시 보내주세요.");
    } finally { sending = false; $("fbSend").disabled = false; $("fbSend").textContent = "보내기"; }
  });

  if (!sb) $("fbBtn").hidden = true;

  // ---------- sound: rain + desk sounds ----------
  let audio = null, noiseBuf = null, rainMaster = null, deskMaster = null, rainBuilt = false;
  let soundOn = false, deskOn = false, dropTimer = 0, deskTimer = 0;
  function ensureAudio() {
    if (audio) return;
    audio = new (window.AudioContext || window.webkitAudioContext)();
    const len = audio.sampleRate * 2;
    noiseBuf = audio.createBuffer(1, len, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    rainMaster = audio.createGain(); rainMaster.gain.value = 0; rainMaster.connect(audio.destination);
    deskMaster = audio.createGain(); deskMaster.gain.value = 0; deskMaster.connect(audio.destination);
  }
  function out(node, pan, dest) {
    if (audio.createStereoPanner) { const p = audio.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); node.connect(p); p.connect(dest); }
    else node.connect(dest);
  }
  function noiseHit(t, type, freq, q, amp, dur, pan, dest) {
    const src = audio.createBufferSource(); src.buffer = noiseBuf;
    const f = audio.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = audio.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g); out(g, pan, dest);
    src.start(t, Math.random() * 1.8, dur + 0.02);
  }

  // rain
  function buildRain() {
    rainBuilt = true;
    const hiss = audio.createBufferSource(); hiss.buffer = noiseBuf; hiss.loop = true;
    const hp = audio.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
    const lp = audio.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 5200;
    const hg = audio.createGain(); hg.gain.value = 0.045;
    hiss.connect(hp).connect(lp).connect(hg).connect(rainMaster); hiss.start();
    const rum = audio.createBufferSource(); rum.buffer = noiseBuf; rum.loop = true; rum.playbackRate.value = 0.5;
    const rl = audio.createBiquadFilter(); rl.type = "lowpass"; rl.frequency.value = 260;
    const rg = audio.createGain(); rg.gain.value = 0.22;
    rum.connect(rl).connect(rg).connect(rainMaster); rum.start();
    const lfo = audio.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = audio.createGain(); lfoG.gain.value = 0.02;
    lfo.connect(lfoG).connect(hg.gain); lfo.start();
  }
  function plink(t) {
    const o = audio.createOscillator(), g = audio.createGain();
    const f = 1500 + Math.random() * 1600;
    o.type = "sine"; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.07);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.035, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g).connect(rainMaster); o.start(t); o.stop(t + 0.14);
  }
  function scheduleRain() {
    const now = audio.currentTime;
    const n = 3 + Math.floor(Math.random() * 6);
    for (let i = 0; i < n; i++) noiseHit(now + 0.05 + Math.random() * 0.1, "bandpass", 1400 + Math.random() * 5200, 3 + Math.random() * 6, 0.08 + Math.random() * 0.35, 0.015 + Math.random() * 0.05, Math.random() * 1.6 - 0.8, rainMaster);
    if (Math.random() < 0.09) plink(now + 0.05 + Math.random() * 0.1);
  }

  // desk sounds: keyboard + mouse for 작업 중, pen scratching for 공부 중
  function keyStroke(t, pan, vol) {
    const space = Math.random() < 0.12;
    noiseHit(t, "bandpass", space ? 1300 : 2600 + Math.random() * 1800, 1.4, vol * (space ? 0.32 : 0.22 + Math.random() * 0.16), 0.02 + Math.random() * 0.02, pan, deskMaster);
    noiseHit(t + 0.004, "lowpass", 520, 0.8, vol * (space ? 0.5 : 0.28), 0.045, pan, deskMaster);
  }
  function mouseClick(t, pan, vol) {
    noiseHit(t, "bandpass", 5200 + Math.random() * 900, 5, vol * 0.4, 0.007, pan, deskMaster);
    noiseHit(t + 0.07 + Math.random() * 0.04, "bandpass", 4600, 5, vol * 0.22, 0.006, pan, deskMaster);
    if (Math.random() < 0.25) { const t2 = t + 0.16; noiseHit(t2, "bandpass", 5200, 5, vol * 0.38, 0.007, pan, deskMaster); noiseHit(t2 + 0.08, "bandpass", 4600, 5, vol * 0.2, 0.006, pan, deskMaster); }
  }
  function penStroke(t, dur, pan, vol) {
    // a pencil is many tiny grains catching the paper, not a smooth hiss
    let x = t; const end = t + dur;
    const bright = 3200 + Math.random() * 2400;
    while (x < end) {
      const k = (x - t) / dur, env = Math.sin(Math.PI * k);
      noiseHit(x, "bandpass", bright * (0.85 + Math.random() * 0.3), 2.2, vol * (0.05 + Math.random() * 0.13) * (0.3 + env), 0.006 + Math.random() * 0.006, pan, deskMaster);
      x += 0.005 + Math.random() * 0.011;
    }
    if (Math.random() < 0.18) noiseHit(end + 0.03, "bandpass", 1800, 3, vol * 0.25, 0.012, pan, deskMaster); // dot / tap
  }
  function pageFlip(t, pan, vol) {
    const src = audio.createBufferSource(); src.buffer = noiseBuf;
    const bp = audio.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.7;
    bp.frequency.setValueAtTime(700, t); bp.frequency.exponentialRampToValueAtTime(2600, t + 0.35);
    const g = audio.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.14, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    src.connect(bp).connect(g); out(g, pan, deskMaster); src.start(t, Math.random(), 0.5);
  }
  function scheduleDesk() {
    const now = audio.currentTime, horizon = now + 0.2;
    owlState.forEach((st) => {
      const e = st.entry;
      if (!e || st.walk || (e.status !== "work" && e.status !== "study")) { st.sfx.mode = "pause"; return; }
      const sx = st.sfx, pan = st.group.position.x / 5, vol = e.isMe ? 0.55 : 1;
      if (sx.next < now) sx.next = now + 0.05;
      if (sx.until < now) {
        if (sx.mode === "burst") { sx.mode = "pause"; sx.until = now + 0.6 + Math.random() * 2.2; }
        else { sx.mode = "burst"; sx.until = now + (e.status === "work" ? 1.2 + Math.random() * 3 : 1 + Math.random() * 2.5); }
      }
      if (e.status === "work") {
        if (sx.click < now) sx.click = now + 2 + Math.random() * 5;
        if (sx.click < horizon) { mouseClick(sx.click, pan, vol); sx.click = now + 2.5 + Math.random() * 5; }
        if (sx.mode !== "burst") return;
        while (sx.next < horizon && sx.next < sx.until) { keyStroke(sx.next, pan, vol); sx.next += 0.06 + Math.random() * 0.13; }
      } else {
        if (!sx.flip || sx.flip < now) sx.flip = now + 12 + Math.random() * 20;
        if (sx.flip < horizon) { pageFlip(sx.flip, pan, vol); sx.flip = now + 15 + Math.random() * 25; }
        if (sx.mode !== "burst") return;
        while (sx.next < horizon && sx.next < sx.until) {
          const dur = 0.08 + Math.random() * 0.3;
          penStroke(sx.next, dur, pan, vol);
          sx.next += dur + 0.05 + Math.random() * 0.2;
        }
      }
    });
  }

  function toggleBtn(btn, on, onText, offText) { btn.textContent = on ? onText : offText; btn.setAttribute("aria-pressed", String(on)); }
  $("sound").addEventListener("click", (e) => {
    try {
      ensureAudio(); audio.resume();
      if (!rainBuilt) buildRain();
      soundOn = !soundOn;
      rainMaster.gain.setTargetAtTime(soundOn ? 0.8 : 0, audio.currentTime, 0.5);
      clearInterval(dropTimer); if (soundOn) dropTimer = setInterval(scheduleRain, 100);
      toggleBtn(e.currentTarget, soundOn, "빗소리 끄기", "빗소리");
    } catch (err) { showToast("이 브라우저에서는 소리를 켤 수 없어요."); }
  });
  $("desksound").addEventListener("click", (e) => {
    try {
      ensureAudio(); audio.resume();
      deskOn = !deskOn;
      deskMaster.gain.setTargetAtTime(deskOn ? 0.9 : 0, audio.currentTime, 0.2);
      clearInterval(deskTimer); if (deskOn) deskTimer = setInterval(scheduleDesk, 100);
      toggleBtn(e.currentTarget, deskOn, "책상 소리 끄기", "책상 소리");
      if (deskOn && !owlState.some((st) => st.entry && (st.entry.status === "work" || st.entry.status === "study"))) showToast("작업 중이나 공부 중인 올빼미가 있으면 소리가 나요.");
    } catch (err) { showToast("이 브라우저에서는 소리를 켤 수 없어요."); }
  });
  function hootSound() {
    if (!audio || (!soundOn && !deskOn)) return;
    [0, 0.32].forEach((off, i) => {
      const o = audio.createOscillator(), g = audio.createGain(); o.type = "sine"; o.frequency.value = i ? 392 : 440;
      const t0 = audio.currentTime + off;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.18, t0 + 0.05); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.28);
      o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + 0.3);
    });
  }

  sync();

  // ---------- connect ----------
  if (net) {
    net.onChange(() => { onFloorChange(); sync(); });
    net.onCheer(onCheer);
    net.view();
  }
})();
